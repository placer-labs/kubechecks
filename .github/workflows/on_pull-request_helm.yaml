name: helm ci
on:
  pull_request:
    paths:
      - '.github/workflows/on_pull_request_helm.yaml'
      - 'Makefile'
      - 'charts/**'

permissions: {}

jobs:
  ci-helm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0  # Required for chart-testing to compare changes

      - name: Parse tool versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      # ct runs this through .github/ct.yaml's additional-commands. Pinned, so a
      # new major of the plugin cannot change what a pull request is checked
      # against without a commit saying so. --verify=false because helm 4
      # verifies a plugin source by default and a git source cannot satisfy it;
      # the pinned tag is what makes this reproducible, not the signature.
      - name: Set up helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git \
            --version v1.1.2 --verify=false
          helm unittest --help >/dev/null

      # Likewise, and the version comes from .tool-versions so the binary here
      # matches the one a developer gets from `mise install`.
      - name: Set up kubeconform
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          kubeconform -v

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          changed=$(ct list-changed --config ./.github/ct.yaml --target-branch "$DEFAULT_BRANCH")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --config ./.github/ct.yaml --target-branch "$DEFAULT_BRANCH"
