name: go ci
on:
  pull_request:
    paths:
      - '.github/workflows/on_pull_request_go.yaml'
      - 'Makefile'
      - 'Dockerfile'
      - '*/**.go'
      - '*.go'
      - 'go.mod'
      - 'go.sum'

permissions: {}

jobs:
  ci-golang:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Parse tool versions
        uses: wistia/parse-tool-versions@fecb17a0772bd6f63716ed4476501da191fdc61d # v1.0.1

      - name: Cache Go modules + build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-linux
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13

      - name: Run tests
        run: make test
