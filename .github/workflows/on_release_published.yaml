name: release new version

on:
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  build-binaries:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Build for ${{ matrix.arch }}
        env:
          GIT_COMMIT: ${{ github.sha }}
          GIT_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p out/linux-${{ matrix.arch }}
          time env CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build \
              -trimpath \
              -ldflags="-s -w \
                -X github.com/zapier/kubechecks/pkg.GitCommit=${GIT_COMMIT} \
                -X github.com/zapier/kubechecks/pkg.GitTag=${GIT_TAG}" \
              -o out/linux-${{ matrix.arch }}/kubechecks \
              .

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubechecks-${{ matrix.arch }}
          path: out/linux-${{ matrix.arch }}/kubechecks

  build-image:
    needs: build-binaries
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download amd64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubechecks-amd64
          path: bin-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubechecks-arm64
          path: bin-arm64

      - name: Fix permissions
        run: |
          chmod +x bin-amd64/kubechecks
          chmod +x bin-arm64/kubechecks

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          mkdir -p docker-context
          cp bin-amd64/kubechecks docker-context/kubechecks-amd64
          cp bin-arm64/kubechecks docker-context/kubechecks-arm64

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker-context
          file: ./Dockerfile.runtime
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
