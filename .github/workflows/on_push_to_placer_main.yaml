name: build placer image

on:
  workflow_dispatch:
  push:
    branches:
      - placer/main

concurrency:
  group: placer-image-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build-image:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The production stage runs `/app/kubechecks help` to verify the binary,
      # which executes target-arch code, so arm64 needs emulation. The Go
      # compile itself still cross-compiles on the build platform.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            GIT_TAG=placer-main
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:placer-main
            ghcr.io/${{ github.repository }}:placer-main-${{ github.sha }}
            ghcr.io/${{ github.repository }}:placer-main.${{ github.run_number }}

  publish-chart:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Push the chart unless its version is already published
        env:
          REGISTRY: oci://ghcr.io/${{ github.repository_owner }}/charts
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(yq '.version' charts/kubechecks/Chart.yaml)
          echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          if helm show chart "$REGISTRY/kubechecks" --version "$version" >/dev/null 2>&1; then
            echo "kubechecks $version is already published"
            exit 0
          fi
          helm package charts/kubechecks -d dist
          helm push "dist/kubechecks-$version.tgz" "$REGISTRY"
