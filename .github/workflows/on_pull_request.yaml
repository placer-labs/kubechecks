name: pr_build

on:
  pull_request:
    paths:
      - '*'
      - '*/**'
      - '!README.md'
      - '!COPYING.LGPL-3'
      - '!.gitattributes'
      - '!.gitignore'
    types:
      - opened
      - reopened
      - synchronize

env:
  FS_TAG: 0.0.0-pr${{ github.event.pull_request.number }}

permissions: {}

jobs:
  build-binaries:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    env:
      GIT_COMMIT: ${{ github.sha }}
      GIT_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Cache Go modules + build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-linux-${{ matrix.arch }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Build for ${{ matrix.arch }}
        run: |
          mkdir -p out/linux-${{ matrix.arch }}
          time env CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build \
              -trimpath \
              -ldflags="-s -w \
                -X github.com/zapier/kubechecks/pkg.GitCommit=${GIT_COMMIT} \
                -X github.com/zapier/kubechecks/pkg.GitTag=${GIT_TAG}" \
              -o out/linux-${{ matrix.arch }}/kubechecks \
              .

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kubechecks-${{ matrix.arch }}
          path: out/linux-${{ matrix.arch }}/kubechecks

  build-image:
    needs: build-binaries
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      pull-requests: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kubechecks
      FS_TAG: 0.0.0-pr${{ github.event.pull_request.number }}

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download amd64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubechecks-amd64
          path: bin-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: kubechecks-arm64
          path: bin-arm64
      - name: Fix permissions
        run: |
          chmod +x bin-amd64/kubechecks
          chmod +x bin-arm64/kubechecks
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          mkdir -p docker-context
          cp bin-amd64/kubechecks docker-context/kubechecks-amd64
          cp bin-arm64/kubechecks docker-context/kubechecks-arm64

      - name: Build and push multi-arch image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./docker-context
          file: ./Dockerfile.runtime
          push: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.FS_TAG }}

      - uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        with:
          message: |
            Temporary image available at:
            `ghcr.io/${{ github.repository_owner }}/kubechecks:${{ env.FS_TAG }}`

  release-helm:
    needs: build-image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      pull-requests: write

    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name

    env:
      CHART_VERSION: 0.0.0-pr${{ github.event.pull_request.number }}
      APP_VERSION: 0.0.0-pr${{ github.event.pull_request.number }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Update chart version and appVersion
        run: |
          # Update kubechecks chart
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/kubechecks/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" charts/kubechecks/Chart.yaml

      - name: Package and push kubechecks chart
        run: |
          helm package charts/kubechecks
          helm push "kubechecks-${CHART_VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"


      - name: Update PR comment with chart info
        uses: mshick/add-pr-comment@ec328af66588ab8f77cdeb2c264f14aba45bbf59 # v3.12.0
        with:
          message: |
            Temporary Helm chart (version `${{ env.CHART_VERSION }}`) available:

            **Install directly:**
            ```bash
            helm install kubechecks oci://ghcr.io/${{ github.repository_owner }}/charts/kubechecks --version ${{ env.CHART_VERSION }}
            ```

            **Pull to inspect:**
            ```bash
            helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/kubechecks --version ${{ env.CHART_VERSION }}
            ```

            **Note:** OCI charts don't use `helm repo add` - use the chart URL directly.
