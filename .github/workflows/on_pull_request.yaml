name: pr_build

on:
  pull_request:
    paths:
      - '*'
      - '*/**'
      - '!README.md'
      - '!COPYING.LGPL-3'
      - '!.gitattributes'
      - '!.gitignore'
    types:
      - opened
      - reopened
      - synchronize

env:
  FS_TAG: 0.0.0-pr${{ github.event.pull_request.number }}

permissions: {}

jobs:
  build-binaries:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    env:
      GIT_COMMIT: ${{ github.sha }}
      GIT_TAG: ${{ github.ref_name }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Cache Go modules + build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-linux-${{ matrix.arch }}
          restore-keys: |
            ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}-
            ${{ runner.os }}-go-

      - name: Build for ${{ matrix.arch }}
        run: |
          mkdir -p out/linux-${{ matrix.arch }}
          time env CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.arch }} \
            go build \
              -trimpath \
              -ldflags="-s -w \
                -X github.com/zapier/kubechecks/pkg.GitCommit=${GIT_COMMIT} \
                -X github.com/zapier/kubechecks/pkg.GitTag=${GIT_TAG}" \
              -o out/linux-${{ matrix.arch }}/kubechecks \
              .

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubechecks-${{ matrix.arch }}
          path: out/linux-${{ matrix.arch }}/kubechecks

  build-image:
    needs: build-binaries
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      pull-requests: write

    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/kubechecks
      FS_TAG: 0.0.0-pr${{ github.event.pull_request.number }}

    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Download amd64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubechecks-amd64
          path: bin-amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubechecks-arm64
          path: bin-arm64
      - name: Fix permissions
        run: |
          chmod +x bin-amd64/kubechecks
          chmod +x bin-arm64/kubechecks
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare build context
        run: |
          mkdir -p docker-context
          cp bin-amd64/kubechecks docker-context/kubechecks-amd64
          cp bin-arm64/kubechecks docker-context/kubechecks-arm64

      - name: Build and push multi-arch image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./docker-context
          file: ./Dockerfile.runtime
          push: ${{ github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.FS_TAG }}

      - uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        if: github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
        with:
          message: |
            Temporary image available at:
            `ghcr.io/${{ github.repository_owner }}/kubechecks:${{ env.FS_TAG }}`

  release-helm:
    needs: build-image
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      pull-requests: write

    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name

    env:
      CHART_VERSION: 0.0.0-pr${{ github.event.pull_request.number }}
      APP_VERSION: 0.0.0-pr${{ github.event.pull_request.number }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Login to GHCR
        env:
          GH_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin

      - name: Update chart version and appVersion
        run: |
          # Update kubechecks chart
          sed -i "s/^version:.*/version: ${CHART_VERSION}/" charts/kubechecks/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${APP_VERSION}\"/" charts/kubechecks/Chart.yaml

      - name: Package and push kubechecks chart
        run: |
          helm package charts/kubechecks
          helm push "kubechecks-${CHART_VERSION}.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts"


      - name: Update PR comment with chart info
        uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
        with:
          message: |
            Temporary Helm chart (version `${{ env.CHART_VERSION }}`) available:

            **Install directly:**
            ```bash
            helm install kubechecks oci://ghcr.io/${{ github.repository_owner }}/charts/kubechecks --version ${{ env.CHART_VERSION }}
            ```

            **Pull to inspect:**
            ```bash
            helm pull oci://ghcr.io/${{ github.repository_owner }}/charts/kubechecks --version ${{ env.CHART_VERSION }}
            ```

            **Note:** OCI charts don't use `helm repo add` - use the chart URL directly.
