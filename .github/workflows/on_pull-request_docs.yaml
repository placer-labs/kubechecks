name: docs ci
on:
  pull_request:
    paths:
      - '.github/workflows/on_pull_request_docs.yaml'
      - 'Makefile'
      - '*/**.go'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'docs/usage.md*'

permissions: {}

jobs:
  lint-docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Parse tool versions
        uses: wistia/parse-tool-versions@fecb17a0772bd6f63716ed4476501da191fdc61d # v1.0.1

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ env.GOLANG_TOOL_VERSION }}
          cache: true

      - name: Rebuild the docs
        run: make rebuild-docs

      - name: Verify that the checked in file has not changed
        run: ./hacks/exit-on-changed-files.sh "Please run 'make rebuild-docs' and commit the results to this PR"
