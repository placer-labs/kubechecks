name: docs ci
on:
  pull_request:
    paths:
      - '.github/workflows/on_pull_request_docs.yaml'
      - 'Makefile'
      - '*/**.go'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - 'docs/usage.md*'

permissions: {}

jobs:
  lint-docs:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse tool versions
        uses: wistia/parse-tool-versions@32f568a4ffd4bfa7720ebf93f171597d1ebc979a # v2.1.1

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ env.GOLANG_TOOL_VERSION }}
          cache: true

      - name: Rebuild the docs
        run: make rebuild-docs

      - name: Verify that the checked in file has not changed
        run: ./hacks/exit-on-changed-files.sh "Please run 'make rebuild-docs' and commit the results to this PR"
