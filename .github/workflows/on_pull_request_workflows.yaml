name: workflows ci
on:
  pull_request:
    paths:
      - '.github/**'

permissions: {}

jobs:
  lint-workflows:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.26.x"
          cache: false

      - name: Run zizmor
        run: pipx run --spec zizmor==1.31.1 zizmor --offline --format=github .github/workflows

      - name: Run actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
