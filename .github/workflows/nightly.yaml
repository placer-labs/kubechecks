name: maintenance

on:
  schedule:
    - cron: "0 9 * * 1"   # 9 am on Monday

permissions: {}

jobs:
  clean-up:
    runs-on: ubuntu-24.04

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@997185467fa4f803885201cee163a9f38240193d # v10.1.1
        with:
          days-before-stale: '120'
