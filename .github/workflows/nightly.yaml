name: maintenance

on:
  schedule:
    - cron: "0 9 * * 1"   # 9 am on Monday

permissions: {}

jobs:
  clean-up:
    runs-on: ubuntu-24.04

    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: '120'
