version: 2
updates:
  - directory: "/"
    groups:
      minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # projects that aren't at 1.0 yet tend to have breaking changes,
      # so we don't batch those up with this "stable small changes" group
      - dependency-name: "*"
        versions: "<1"
    package-ecosystem: "gomod"
    schedule:
      interval: "weekly"
    # Only propose releases that have been public for a week. Keep in sync with
    # MIN_AGE_DAYS in workflows/dependabot_automerge.yaml, which applies the
    # same age floor to security updates (which ignore cooldown).
    cooldown:
      default-days: 7
  - directory: "/"
    groups:
      github-actions:
        patterns:
          - "*"
    package-ecosystem: "github-actions"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
