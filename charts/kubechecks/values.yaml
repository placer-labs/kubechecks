# Labels to apply to all resources created by this Helm chart
argocd:
  namespace: argocd

  # kubechecks generates the manifests it diffs by calling Argo CD's own
  # repo-server over gRPC (KUBECHECKS_ARGOCD_REPOSITORY_ENDPOINT). The argo-cd
  # chart puts a NetworkPolicy over that port admitting only four in-namespace
  # Argo CD components, so on a cluster that enforces NetworkPolicy the call
  # from this chart's namespace is dropped and every check times out with a
  # context deadline that names no policy. This adds the missing source.
  #
  # NetworkPolicies union, so this neither edits nor conflicts with the policy
  # the argo-cd release owns. It is created in `namespace` above, because a
  # NetworkPolicy is evaluated in the namespace of the pods it selects.
  networkPolicy:
    # Off by default. Enable it if Argo CD's repo-server is already selected by
    # some other NetworkPolicy, as it is under the argo-cd chart's defaults
    # (global.networkPolicy.create: true). Check with
    # `kubectl get networkpolicy -n argocd`.
    #
    # Do NOT enable it if nothing selects the repo-server yet. A pod with no
    # policy accepts all ingress; the FIRST policy to select it switches it to
    # default-deny. On such a cluster this would not add kubechecks to an
    # existing allowlist -- it would create the allowlist, and everything not
    # on it, argocd-server and the application controller included, would lose
    # the repo-server. Argo CD would then render nothing.
    create: false

    # Selects the repo-server pods within `namespace` above. The argo-cd chart
    # also labels them app.kubernetes.io/instance: <its release name>; this
    # deliberately does not, so the selector holds whatever that release is
    # called. Add the instance label here if more than one Argo CD shares the
    # namespace.
    repoServerSelector:
      app.kubernetes.io/name: argocd-repo-server

    # The repo-server's gRPC port. Named rather than numbered, as the argo-cd
    # chart's own policy names it, so a repo-server moved off 8081 carries
    # this with it. A number works too.
    port: repo-server

commonLabels: {}

rbac:
  # Grant get/list/watch on Secrets in every namespace. kubechecks only reads
  # repository and cluster credentials from argocd.namespace, which the
  # namespaced Role already covers, so this is off. It's here for setups that
  # keep those secrets elsewhere.
  clusterWideSecrets: false

configMap:
  create: false
  env: {}
  # KUBECHECKS_ADDITIONAL_APPS_NAMESPACES: "*"
  # KUBECHECKS_ARGOCD_API_INSECURE: "false"
  # KUBECHECKS_ARGOCD_API_PATH_PREFIX: /
  # KUBECHECKS_ARGOCD_API_NAMESPACE: argocd
  # KUBECHECKS_ARGOCD_WEBHOOK_URL: https://argocd.<domain.com>/api/webhook
  # KUBECHECKS_FALLBACK_K8S_VERSION: "1.22.0"
  # KUBECHECKS_LOG_LEVEL: debug
  # KUBECHECKS_NAMESPACE: kubechecks
  # KUBECHECKS_WEBHOOK_URL_BASE: https://kubechecks.<domain.com>.
  # KUBECHECKS_WEBHOOK_URL_PREFIX: kubechecks
  # KUBECHECKS_ARGOCD_API_SERVER_ADDR: argocd.<domain.com>
  # ARGOCD_EXEC_TIMEOUT: 600s
  # KUBECHECKS_OTEL_COLLECTOR_PORT: "4317"
  # KUBECHECKS_OTEL_ENABLED: "true"
  # KUBECHECKS_VCS_TYPE: "github"
  # KUBECHECKS_TIDY_OUTDATED_COMMENTS_MODE: "hide" # other options delete
  # KUBECHECKS_ARCHIVE_CACHE_DIR: "/tmp/kubechecks/archives"
  # KUBECHECKS_ARCHIVE_CACHE_TTL: "24h"
  # KUBECHECKS_REPO_CACHE_DIR: "/tmp/kubechecks/repos"
  # KUBECHECKS_REPO_CACHE_ENABLED "true"
  # KUBECHECKS_REPO_CACHE_TTL: "24h"

deployment:
  annotations: {}
    # reloader.stakater.com/auto: "true"

  podAnnotations: {}

  args: ["controller"]

  # Default values for kubechecks.
  resources:
    limits:
      memory: 1Gi
    requests:
      memory: 256Mi
      cpu: 200m

  revisionHistoryLimit: 10
  replicaCount: 1

  image:
    pullPolicy: Always
    name: "ghcr.io/zapier/kubechecks"
    tag: "latest"
    # Pin the image by digest (sha256:...). When set it is appended to the
    # tag (name:tag@digest), and the runtime pulls exactly that image.
    digest: ""

  imagePullSecrets: []

  nodeSelector: {}

  tolerations: []

  affinity: {}

  # Restricted Pod Security Standard by default. The image runs as the
  # kubechecks user (uid/gid 1000); override all three ids together if you
  # run a different image.
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    privileged: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Writable scratch space. kubechecks clones repos, unpacks archives and caches
  # charts and schemas under /tmp, so a read-only root filesystem needs this.
  # XDG_* are pointed into it too, for Helm's config and cache.
  tmpVolume:
    enabled: true
    # Any emptyDir fields, e.g. sizeLimit: 10Gi or medium: Memory.
    emptyDir: {}

  env: []

  envFrom: []

  # /live answers as soon as the HTTP server is up. /ready also waits for the
  # Application/ApplicationSet informer caches to sync, so a new pod gets no
  # webhooks until it can match them to apps.
  #
  # The startup probe covers the slow part of boot (webhook registration, the
  # first informer list), allowing up to 5 minutes. Once it passes, liveness
  # restarts a hung pod after ~30s and readiness pulls it out of the Service
  # after ~30s, instead of the 5 minutes each used to take.
  startupProbe:
    failureThreshold: 30
    periodSeconds: 10
    timeoutSeconds: 5

  livenessProbe:
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  readinessProbe:
    failureThreshold: 3
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 5

  # On SIGTERM kubechecks drains in-flight checks before exiting. The chart
  # sets KUBECHECKS_SHUTDOWN_TIMEOUT to 5s less than this, so the drain
  # finishes before the kubelet's SIGKILL. A KUBECHECKS_SHUTDOWN_TIMEOUT you
  # set in configMap.env, secrets.env or deployment.env takes precedence.
  #
  # Spot/preemptible nodes give about 30s of notice in total, and GKE gives
  # regular pods only part of that during node shutdown. Lower this to match
  # if checks are being cut off. A check cut off here re-runs on the next push.
  terminationGracePeriodSeconds: 30

  volumes: []
  volumeMounts: []

secrets:
  create: false
  name: '{{ include "kubechecks.fullname" . }}'
  # envs can be used for writing sensitive environment variables
  # to the secret resource. These should be passed into the
  # deployment as arguments.
  env: {}
  # KUBECHECKS_VCS_TOKEN: <token>

serviceAccount:
  # Specifies whether a service account should be created or used
  create: true
  enabled: true
  # kubechecks talks to the Kubernetes API, so the token is mounted by default.
  automountServiceAccountToken: true
  name: '{{ include "kubechecks.fullname" . }}'
  annotations: {}

service:
  create: true
  type: ClusterIP
  port: 8080
  name: http

ingress:
  create: false
  className: ""
  # annotations:
  #   kubernetes.io/ingress.class: nginx
  #   # See https://cert-manager.readthedocs.io/en/latest/reference/ingress-shim.html#supported-annotations
  #   kubernetes.io/tls-acme: "true"
  hosts:
    kubechecks.local:
      paths:
        - path: "/hooks"
          pathType: Prefix

  # Secrets must be manually created in the namespace
  # tls:
  #  - secretName: kubechecks-ingress-tls
  #    hosts:
  #    - kubechecks.example.com

# Leave kubechecks at one replica. Each repository's checks run through an
# in-process queue, one at a time per repo; with several replicas, two pushes
# to the same PR can land on different pods and race on its comment. Only
# enable autoscaling if you accept that.
autoscaling:
  create: false
  # minReplicas: 1
  # maxReplicas: 100
  # targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Only useful with more than one replica (see autoscaling above). With one
# replica, maxUnavailable: 1 doesn't protect anything, and minAvailable: 1
# blocks node drains.
podDisruptionBudget:
  create: false
  maxUnavailable: 1
  # minAvailable: 1
