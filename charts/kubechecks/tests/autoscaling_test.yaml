suite: autoscaling tests

templates:
  - templates/hpa.yaml
  - templates/deployment.yaml

tests:
  - it: renders an autoscaling/v2 HPA
    template: templates/hpa.yaml
    set:
      autoscaling:
        create: true
        minReplicas: 1
        maxReplicas: 3
        targetCPUUtilizationPercentage: 10
        targetMemoryUtilizationPercentage: 15
    asserts:
      - equal:
          path: apiVersion
          value: autoscaling/v2
      - equal:
          path: spec.metrics[0]
          value:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 10
      - equal:
          path: spec.metrics[1]
          value:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 15

  - it: renders nothing by default
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves replicas to the HPA when enabled
    template: templates/deployment.yaml
    set:
      autoscaling:
        create: true
        minReplicas: 1
        maxReplicas: 3
    asserts:
      - notExists:
          path: spec.replicas
