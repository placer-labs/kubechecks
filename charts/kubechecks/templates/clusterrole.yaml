apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubechecks.fullname" . }}
  labels: {{- include "kubechecks.labels" . | nindent 4 }}
rules:
  - apiGroups: ['argoproj.io']
    resources: ['applications', 'appprojects', 'applicationsets']
    verbs: ['get', 'list', 'watch']
  {{- if .Values.rbac.clusterWideSecrets }}
  - apiGroups: [''] # The core API group, which is indicated by an empty string
    resources: ['secrets']
    verbs: ['get', 'list', 'watch']
  {{- end }}
