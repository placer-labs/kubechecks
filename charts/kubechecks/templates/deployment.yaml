apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubechecks.fullname" . }}
  {{- with .Values.deployment.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end}}
  labels: {{- include "kubechecks.labels" . | nindent 4 }}
spec:
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  {{- if not .Values.autoscaling.create }}
  replicas: {{ .Values.deployment.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kubechecks.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.configMap.create .Values.secrets.create .Values.deployment.podAnnotations }}
      annotations:
      {{- if .Values.configMap.create }}
        {{- /* Hash the data only, so a chart bump or label change doesn't roll the pods. */}}
        checksum/config: {{ .Values.configMap.env | toJson | sha256sum }}
      {{- end }}
      {{- if .Values.secrets.create }}
        checksum/secret: {{ .Values.secrets.env | toJson | sha256sum }}
      {{- end }}
      {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      labels:
        {{- if .Values.commonLabels }}
        {{- toYaml .Values.commonLabels | nindent 8 }}
        {{- end }}
        {{- include "kubechecks.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.deployment.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.enabled}}
      serviceAccountName: {{ include "kubechecks.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.deployment.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.deployment.podSecurityContext | nindent 8 }}
      {{- with .Values.deployment.initContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.deployment.image }}
          image: "{{ .name }}:{{ required "must set .deployment.image.tag" .tag }}{{ with .digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .pullPolicy }}
          {{- end }}
          {{- with .Values.deployment.args }}
          args: {{ . | toYaml | nindent 12 }}
          {{- end }}
          {{- if or .Values.configMap.create .Values.secrets.create .Values.deployment.envFrom }}
          envFrom:
            {{- if .Values.configMap.create }}
            - configMapRef:
                name: {{ include "kubechecks.name" . }}
            {{- end }}
            {{- if .Values.secrets.create }}
            - secretRef:
                name: {{ include "kubechecks.secretsName" . }}
            {{- end }}
          {{- with .Values.deployment.envFrom }}
            {{- . | toYaml | nindent 12 }}
          {{- end }}
          {{- end }}
          env:
            {{- include "kubechecks.shutdownTimeoutEnv" . | trim | nindent 12 }}
            {{- if .Values.deployment.tmpVolume.enabled }}
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: XDG_CONFIG_HOME
              value: /tmp/.config
            - name: XDG_DATA_HOME
              value: /tmp/.local/share
            {{- end }}
            {{- with .Values.deployment.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: {{ .Values.service.name }}
              containerPort: 8080
              protocol: TCP
          {{- with .Values.deployment.securityContext}}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.deployment.resources | nindent 12 }}
          startupProbe:
            httpGet:
              path: /live
              port: {{ .Values.service.name }}
              scheme: HTTP
            {{- toYaml .Values.deployment.startupProbe | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.service.name }}
              scheme: HTTP
            {{- toYaml .Values.deployment.livenessProbe | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.name }}
              scheme: HTTP
            {{- toYaml .Values.deployment.readinessProbe | nindent 12 }}
          {{- if or .Values.deployment.volumeMounts .Values.deployment.tmpVolume.enabled }}
          volumeMounts:
            {{- if .Values.deployment.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- with .Values.deployment.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.deployment.volumes .Values.deployment.tmpVolume.enabled }}
      volumes:
        {{- if .Values.deployment.tmpVolume.enabled }}
        - name: tmp
          emptyDir: {{ .Values.deployment.tmpVolume.emptyDir | toJson }}
        {{- end }}
        {{- with .Values.deployment.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}