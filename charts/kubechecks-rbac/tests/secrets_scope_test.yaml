suite: secrets access scope

templates:
  - role.yaml
  - rolebinding.yaml

tests:
  - it: grants Secrets only through a Role in the Argo CD namespace by default
    template: role.yaml
    asserts:
      - notContains:
          path: rules
          content:
            apiGroups: ['']
            resources: ['secrets']
            verbs: ['get', 'list', 'watch']
        documentIndex: 0
      - isKind:
          of: Role
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: argocd
        documentIndex: 1
      - equal:
          path: rules
          value:
            - apiGroups: ['']
              resources: ['secrets']
              verbs: ['get', 'list', 'watch']
        documentIndex: 1

  - it: puts the Role in the configured namespace
    template: role.yaml
    set:
      namespace: gitops
    asserts:
      - equal:
          path: metadata.namespace
          value: gitops
        documentIndex: 1

  - it: grants cluster-wide Secrets when clusterWideSecrets is true
    template: role.yaml
    set:
      clusterWideSecrets: true
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: ['']
            resources: ['secrets']
            verbs: ['get', 'list', 'watch']
        documentIndex: 0

  - it: binds the group to the Role in the Argo CD namespace
    template: rolebinding.yaml
    asserts:
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: metadata.namespace
          value: argocd
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            kind: Role
            name: kubechecks-remote-role
            apiGroup: rbac.authorization.k8s.io
        documentIndex: 1
      - equal:
          path: subjects[0].name
          value: kubechecks-remote-group
        documentIndex: 1
