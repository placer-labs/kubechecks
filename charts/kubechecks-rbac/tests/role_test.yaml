suite: role tests

templates:
  - role.yaml

tests:
  - it: should create a Role with the correct name
    set:
      clusterRoleName: "kubechecks-test-role"
    asserts:
      - isKind:
          of: ClusterRole
        documentIndex: 0
      - equal:
          path: metadata.name
          value: kubechecks-test-role
        documentIndex: 0
